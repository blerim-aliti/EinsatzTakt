services:
  - type: web
    name: einsatztakt-app
    runtime: node
    region: frankfurt
    branch: security/backend-hardening
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    domains:
      - app.einsatztakt.de
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/einsatztakt.sqlite
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: einsatztakt-data
      mountPath: /var/data
      sizeGB: 1
